name: Replace Skype with YouTube

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  replace-social-icon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace Skype icon with YouTube on all HTML pages
        shell: bash
        run: |
          set -e
          changed=0
          while IFS= read -r -d '' file; do
            if grep -q 'bxl-skype' "$file"; then
              sed -i 's/bxl-skype/bxl-youtube/g' "$file"
              changed=1
              echo "Updated: $file"
            fi
          done < <(find . -type f -name '*.html' -not -path './.git/*' -print0)

          if [ "$changed" -eq 0 ]; then
            echo "No Skype icons found."
          fi

      - name: Commit changes if needed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Replace Skype social icon with YouTube"
            git push
          fi
