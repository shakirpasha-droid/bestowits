name: Fix Bestow favicon links

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  add-favicon-links:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add favicon links to all HTML pages
        shell: python
        run: |
          from pathlib import Path

          files = [
              'index.html',
              'about_us.html',
              'services.html',
              'features.html',
              'contact_us.html',
              'privacy_policy.html',
          ]

          favicon = '''  <!-- Bestow IT Services favicon -->\n  <link rel="icon" type="image/png" sizes="512x512" href="/assets/img/favicon.png">\n  <link rel="apple-touch-icon" sizes="512x512" href="/assets/img/favicon.png">\n'''

          for name in files:
              path = Path(name)
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              # Remove any older active/commented favicon declarations from the template.
              import re
              text = re.sub(r'\s*<!--\s*Bestow IT Services favicon -->.*?(?=<link href="https://fonts\.googleapis\.com|</head>)', '\n', text, flags=re.S | re.I)
              text = re.sub(r'\s*<link[^>]+rel=["\'](?:icon|shortcut icon|apple-touch-icon)["\'][^>]*>', '', text, flags=re.I)
              marker = '<head>'
              if marker in text:
                  text = text.replace(marker, marker + '\n' + favicon, 1)
              path.write_text(text, encoding='utf-8')

      - name: Commit favicon links
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html about_us.html services.html features.html contact_us.html privacy_policy.html
          if git diff --cached --quiet; then
            echo "No favicon changes needed."
            exit 0
          fi
          git commit -m "Fix favicon links across website"
          git push
