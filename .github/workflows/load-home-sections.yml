name: Load Bestow Homepage Sections

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure homepage loads trust sections
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          tags = [
              '<script src="assets/js/home-sections.js"></script>',
              '<script src="assets/js/feedback-enhancements.js"></script>'
          ]
          for tag in tags:
              if tag not in text:
                  text = text.replace('</body>', f'  {tag}\n</body>', 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit homepage change if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Homepage scripts already loaded"
          else
            git commit -m "Enable customer feedback visual enhancements"
            git push
          fi
