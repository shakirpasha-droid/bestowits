name: Load Bestow Homepage Social Links

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keep homepage social links script only
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('  <script src="assets/js/feedback-enhancements.js"></script>\n', '')
          if '<script src="assets/js/home-sections.js"></script>' not in text:
              text = text.replace('</body>', '  <script src="assets/js/home-sections.js"></script>\n</body>', 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit homepage change if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Homepage already updated"
          else
            git commit -m "Remove customer feedback from homepage"
            git push
          fi
