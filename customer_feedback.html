<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Feedback | Bestow IT Services</title>
  <meta name="description" content="Share your experience with Bestow IT Services. Your feedback helps us improve our IT support and services.">
  <link rel="icon" type="image/png" href="/assets/img/favicon.png">
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <style>
    :root{--blue:#2454f4;--dark:#101f46;--text:#42516d}
    body{font-family:Poppins,Arial,sans-serif;background:#f4f8ff;color:var(--text)}
    .feedback-wrap{min-height:100vh;padding:70px 15px;display:flex;align-items:center}
    .feedback-card{width:min(720px,100%);margin:auto;background:#fff;border-radius:24px;padding:42px;box-shadow:0 18px 55px rgba(27,55,108,.12)}
    .feedback-logo{display:block;max-width:210px;max-height:75px;width:auto;margin:0 auto 24px;object-fit:contain}
    .eyebrow{text-align:center;font-size:11px;letter-spacing:3px;text-transform:uppercase;font-weight:700;color:#53617c;margin-bottom:10px}
    h1{text-align:center;color:var(--dark);font-size:34px;font-weight:700;margin:0 0 10px}.intro{text-align:center;font-size:14px;line-height:1.75;margin:0 auto 30px;max-width:580px}
    .field{width:100%;border:1px solid #dfe6f4;border-radius:10px;background:#fbfcff;padding:12px 14px;font-size:13px;color:#263a60;outline:none}.field:focus{border-color:#5d80f5;box-shadow:0 0 0 3px rgba(36,84,244,.08);background:#fff}
    label{display:block;font-size:12px;font-weight:600;color:#263a60;margin:0 0 7px}.form-group{margin-bottom:17px}
    .consent{display:flex;gap:9px;align-items:flex-start;font-size:11px;line-height:1.55;color:#69768d}.consent input{margin-top:3px}
    .submit{width:100%;border:0;border-radius:10px;background:var(--blue);color:#fff;padding:14px;font-size:14px;font-weight:600;margin-top:18px;cursor:pointer}.submit:disabled{opacity:.65;cursor:wait}
    .status{display:none;margin-top:17px;border-radius:10px;padding:12px;font-size:12px;line-height:1.5}.status.show{display:block}.success{background:#ecfbf2;color:#19713d}.error{background:#fff0f0;color:#a52b2b}
    .back{text-align:center;margin-top:22px}.back a{color:var(--blue);font-size:12px;font-weight:600;text-decoration:none}
    @media(max-width:600px){.feedback-card{padding:28px 20px;border-radius:18px}h1{font-size:28px}}
  </style>
</head>
<body>
<div class="feedback-wrap"><main class="feedback-card">
  <img class="feedback-logo" src="assets/img/logo.png" alt="Bestow IT Services">
  <div class="eyebrow">Customer Experience</div>
  <h1>Share Your Feedback</h1>
  <p class="intro">Thank you for choosing Bestow IT Services. Please tell us about your experience with our service and support.</p>
  <form id="customerFeedbackForm" novalidate>
    <div class="row">
      <div class="col-md-6 form-group"><label for="name">Your Name *</label><input class="field" id="name" name="name" type="text" autocomplete="name" required></div>
      <div class="col-md-6 form-group"><label for="company">Company Name</label><input class="field" id="company" name="company" type="text" autocomplete="organization"></div>
    </div>
    <div class="row">
      <div class="col-md-6 form-group"><label for="email">Email Address *</label><input class="field" id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="col-md-6 form-group"><label for="service">Service Used *</label><select class="field" id="service" name="service" required><option value="" disabled selected>Select a service</option><option>Computer / Laptop Support</option><option>AMC Maintenance</option><option>Network & Wi-Fi</option><option>Data Backup & Recovery</option><option>CCTV / Biometric</option><option>EPABX / Telephone</option><option>Other IT Service</option></select></div>
    </div>
    <div class="form-group"><label for="rating">Overall Rating *</label><select class="field" id="rating" name="rating" required><option value="" disabled selected>Select rating</option><option>5 - Excellent</option><option>4 - Very Good</option><option>3 - Good</option><option>2 - Needs Improvement</option><option>1 - Poor</option></select></div>
    <div class="form-group"><label for="feedback">Your Feedback *</label><textarea class="field" id="feedback" name="feedback" rows="5" maxlength="1000" placeholder="Tell us about your experience..." required></textarea></div>
    <input type="text" name="company_website" tabindex="-1" autocomplete="off" style="display:none">
    <label class="consent"><input type="checkbox" name="publish_consent" value="Yes"> <span>I give Bestow IT Services permission to use my feedback as a testimonial on its website. My feedback may be edited for length or spelling without changing its meaning.</span></label>
    <button class="submit" type="submit" id="submitBtn">Submit Feedback</button>
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </form>
  <div class="back"><a href="index.html">← Back to Bestow IT Services</a></div>
</main></div>
<script>
(function(){
  const form=document.getElementById('customerFeedbackForm'), btn=document.getElementById('submitBtn'), status=document.getElementById('status');
  const WEB3FORMS_KEY='414c8cf7-4187-4369-ad45-8c6132dd6610';
  form.addEventListener('submit',async function(e){
    e.preventDefault();
    if(form.querySelector('input[name="company_website"]').value) return;
    if(!form.checkValidity()){form.reportValidity();return;}
    btn.disabled=true;btn.textContent='Sending...';status.className='status';status.textContent='';
    const data=Object.fromEntries(new FormData(form).entries());
    data.access_key=WEB3FORMS_KEY;
    data.subject='New Customer Feedback - BESTOW IT SERVICES';
    data.from_name='BESTOW IT SERVICES Customer Feedback';
    data.to='shakirpasha@bestowits.com,bestowits@gmail.com';
    data.redirect='false';
    try{
      const r=await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(data)});
      const result=await r.json();
      if(!r.ok || result.success!==true) throw new Error(result.message||'Unable to submit feedback.');
      status.className='status success show';status.textContent='Thank you! Your feedback has been submitted successfully.';form.reset();
    }catch(err){status.className='status error show';status.textContent=err.message||'Something went wrong. Please try again.';}
    finally{btn.disabled=false;btn.textContent='Submit Feedback';}
  });
})();
</script>
</body>
</html>
